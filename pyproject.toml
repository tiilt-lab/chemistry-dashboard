# Ruff configuration for the first-party Python in src/.
#
# The backend previously had NO static analysis (the frontend has eslint). Ruff
# runs in CI with a ratcheted violation cap (see .github/workflows/ci.yml) — the
# same policy as the eslint gate: no NEW violations may land, and the cap only
# ever decreases. The current backlog (mostly unused imports) is worked down
# over time, not required to be zero today.
[tool.ruff]
target-version = "py311"

# Third-party / vendored / generated code — not ours to lint.
extend-exclude = [
  "src/venv-crisper",
  "src/venv-nemo",
  "src/venv-unified",
  "src/video_processing/yolo_head",
  "src/video_processing/asd",
  "src/video_processing/attention_tracking",
  "src/video_processing/video_cartoonizer/model",
  "src/video_processing/emotion_detector/models",
  "src/server/migrations/versions",
]

[tool.ruff.lint]
# Real-correctness rules, not style:
#   F    = pyflakes (unused/undefined names, redefinitions, bad f-strings)
#   E9   = syntax / IO errors
#   E722 = bare `except:` (swallows KeyboardInterrupt/SystemExit, hides errors)
#   B006 = mutable default argument (shared-state bug)
#   B023 = function/lambda in a loop not binding the loop variable (late-binding
#          closure bug). Both B-classes are currently at zero — keep them there.
select = ["F", "E9", "E722", "B006", "B023"]

# deptry (CI job "deptry", tools/ci/deptry_check.sh): the packages src/
# imports must be the ones src/requirements-direct.txt lists; the lock pins
# those and everything they pull in. The excludes are ruff's vendored set.
[tool.deptry]
requirements_files = ["src/requirements-direct.txt"]
# The vendored model code (yolo_head, asd, video_cartoonizer/model, ...) is
# scanned too: it runs in production and its imports (ultralytics, skimage,
# onnx, ...) must stay pinned. Its optional and tooling imports are ignored
# below instead.
exclude = ["src/venv-"]

# Distribution name -> module name where deptry's normalisation does not
# reach (CI has none of these installed to read their metadata).
[tool.deptry.package_module_name_map]
opencv-python = "cv2"
opencv-python-headless = "cv2"
pillow = "PIL"
scikit-learn = "sklearn"
scikit-image = "skimage"
PyYAML = "yaml"
python-dotenv = "dotenv"
ultralytics-thop = "thop"
onnxruntime-gpu = "onnxruntime"
setuptools = ["setuptools", "pkg_resources"]
google-api-core = "google"
google-auth = "google"
google-genai = "google"
googleapis-common-protos = "google"
protobuf = "google"
pyannote-audio = "pyannote"
pyannote-core = "pyannote"
pyannote-database = "pyannote"
pyannote-metrics = "pyannote"
pyannote-pipeline = "pyannote"
PyPDF2 = "PyPDF2"

[tool.deptry.per_rule_ignores]
# Imported only inside workers that run in another venv (CrisperWhisper,
# MOSS, the WhisperX diarizers, Qwen3), or by vendored model code for its
# training, export and notebook paths, which production never takes.
DEP001 = [
  "crisperwhisper", "diarizen", "moss_transcribe_diarize", "nemo", "flash_attention_interface", "vllm", "qwen_asr",
  "IPython", "alt_cuda_corr", "coremltools", "lmdb", "pycocotools", "raft", "resampy", "seaborn", "torchsummary",
  "torchvggish", "wandb", "wandb_utils", "test", "datasets", "evaluate",
]

